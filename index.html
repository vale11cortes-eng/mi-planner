/* ── CLOUD PERSISTENCE HOOK ── */
function usePersist(key, init) {
  const user = useContext(AuthContext);
  const initVal = () => (typeof init === "function" ? init() : init);
  const [val, setVal] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : initVal(); }
    catch { return initVal(); }
  });
  const [cloudReady, setCloudReady] = useState(false);
  const firstCloudLoad = useRef(true);

  useEffect(() => {
    if (!user) return;
    setCloudReady(false);
    firstCloudLoad.current = true;
    const ref = db.collection("users").doc(user.uid).collection("planner").doc(key);
    const unsub = ref.onSnapshot((snap) => {
      if (snap.exists) {
        const data = snap.data();
        setVal(data.value ?? initVal());
      } else {
        try {
          const local = localStorage.getItem(key);
          setVal(local ? JSON.parse(local) : initVal());
        } catch { setVal(initVal()); }
      }
      setCloudReady(true);
      firstCloudLoad.current = false;
    }, (err) => {
      console.error("Error leyendo Firebase", key, err);
      setCloudReady(true);
    });
    return () => unsub();
  }, [user?.uid, key]);

  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
    if (!user || !cloudReady || firstCloudLoad.current) return;
    db.collection("users").doc(user.uid).collection("planner").doc(key).set({
      value: val,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).catch(err => console.error("Error guardando Firebase", key, err));
  }, [key, val, user?.uid, cloudReady]);

  return [val, setVal];
}

/* ── AI RECEIPT ── */
async function scanReceipt(b64, mime) {
  const res = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      model:"claude-sonnet-4-20250514", max_tokens:800,
      messages:[{role:"user",content:[
        {type:"image",source:{type:"base64",media_type:mime,data:b64}},
        {type:"text",text:`Analizá esta imagen de un gasto (boleta, ticket, transferencia, comprobante).
Respondé SOLO con JSON válido, sin texto extra, sin backticks:
{"desc":"descripción corta máx 40 chars","amount":12500,"date":"2026-05-03","category":"Salud|Alimentación|Universidad|Transporte|Social|Personal|Otro","confidence":"alta|media|baja","notes":"nota si algo no está claro o es null"}
Monto como número sin puntos. Fecha YYYY-MM-DD. Si no podés leer algo usá null.`}
      ]}]
    })
  });
  const d=await res.json();
  return JSON.parse((d.content?.find(b=>b.type==="text")?.text||"{}").trim());
}

                    <button onClick={()=>toggleTask(t.id)} style={{width:15,height:15,borderRadius:4,border:`1.5px solid ${am.color}`,background:t.done?am.color:"none",cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,color:"#fff"}}>{t.done?"✓":""}</button>

                    <span style={tag(am.color)}>{am.label.split(" ")[0]}</span>

          <p style={{fontSize:10,letterSpacing:2,color:C.muted,textTransform:"uppercase",margin:"0 0 8px"}}>Check de hábitos</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:12}}>
            {HABITS_CHECK.map(h=>{

              return (
                <button key={h.id} onClick={()=>toggleHabit(h.id)} style={{display:"flex",alignItems:"center",gap:8,background:on?`${C.base}18`:C.surface,border:`1px solid ${on?C.base:C.border}`,borderRadius:10,padding:"9px 12px",cursor:"pointer",textAlign:"left"}}>

              <button onClick={()=>{setNoteInput(todayNote);setShowNoteEdit(p=>!p);}} style={{...btn(C.soft,C.muted),fontSize:11,padding:"4px 10px"}}>{showNoteEdit?"Cerrar":todayNote?"Editar":"Escribir"}</button>

                <button onClick={saveNote} style={btn(C.text)}>Guardar</button>
                <button onClick={()=>setShowNoteEdit(false)} style={btn(C.soft,C.muted)}>Cancelar</button>
              </div>

        {/* ══════ TODO ══════ */}
        {tab==="todo"&&<>
          <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
            {["general","uni"].map(v=>(
              <button key={v} onClick={()=>setTodoView(v)} style={{...btn(todoView===v?C.text:C.soft,todoView===v?"#fff":C.muted),fontSize:12,padding:"5px 14px"}}>
                {v==="general"?"Vista General":"📚 UAI"}

            <button onClick={()=>setShowNewTask(p=>!p)} style={{...btn(C.soft,C.text),marginLeft:"auto",fontSize:12}}>
              {showNewTask?"Cerrar":"+ Nueva tarea"}
            </button>
          </div>

          {showNewTask&&<div style={{...card(),marginBottom:12,background:"#fdfcfb"}}>
            <p style={{margin:"0 0 10px",fontSize:13,fontWeight:600}}>Nueva tarea</p>
            <input value={newTask.text} onChange={e=>setNewTask(p=>({...p,text:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addTask()} placeholder="Descripción…" style={{...inp(),marginBottom:8}}/>
            <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:8}}>
              <select value={newTask.area} onChange={e=>setNewTask(p=>({...p,area:e.target.value,tipo:TIPOS[e.target.value][0].id,ramo:null}))} style={{...inp(),flex:1}}>
                {Object.entries(AREA_META).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
              </select>
              <select value={newTask.tipo} onChange={e=>setNewTask(p=>({...p,tipo:e.target.value}))} style={{...inp(),flex:1}}>

            <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:newTask.area==="uni"?8:10}}>

                {HOURS.map(h=><option key={h} value={h}>{h}:00</option>)}
              </select>
            </div>
            {newTask.area==="uni"&&<select value={newTask.ramo||""} onChange={e=>setNewTask(p=>({...p,ramo:e.target.value}))} style={{...inp(),marginBottom:10}}>

            </select>}

              <button onClick={addTask} style={btn(C.text)}>Agregar</button>
              <button onClick={()=>setShowNewTask(false)} style={btn(C.soft,C.muted)}>Cancelar</button>
            </div>
          </div>}

          {todoView==="general"&&Object.entries(AREA_META).map(([ak,am])=>{
            const at=tasks.filter(t=>t.area===ak);

            return <div key={ak} style={{...card(),marginBottom:10,borderTop:`3px solid ${am.color}`}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                <span style={{fontSize:14,fontWeight:600,color:am.color}}>{am.label}</span>
                <span style={{fontSize:11,color:C.muted}}>{at.filter(t=>t.done).length}/{at.length}</span>

              {(TIPOS[ak]||[]).map(tipo=>{

                return <div key={tipo.id} style={{marginBottom:6}}>
                  <div style={{fontSize:10,color:C.muted,fontWeight:600,marginBottom:3,letterSpacing:.5}}>{tipo.icon} {tipo.label.toUpperCase()}</div>
                  {tt.map(t=><TRow key={t.id} t={t} showH={true}/>)}
                </div>;
              })}
            </div>;
          })}

          {todoView==="uni"&&<div>
            <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:12}}>
              {RAMOS.map(r=><button key={r} onClick={()=>setSelRamo(r)} style={{...btn(selRamo===r?C.uni:C.soft,selRamo===r?"#fff":C.muted),fontSize:11,padding:"4px 10px"}}>{r}</button>)}

            <div style={{display:"flex",gap:5,alignItems:"center"}}>

              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:dt.length?6:0}}>
                <div style={{display:"flex",alignItems:"baseline",gap:7}}>
                  <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:20,fontWeight:600,color:isT?C.text:C.muted}}>{d.getDate()}</span>
                  <span style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1}}>{DAYS_S[d.getDay()]}</span>
                  {isT&&<span style={{fontSize:9,background:C.text,color:"#fff",borderRadius:99,padding:"1px 7px",fontWeight:600}}>HOY</span>}
                </div>
                <button onClick={()=>{setNewTask(p=>({...p,date:fmt(d)}));setShowNewTask(true);setTab("todo");}} style={{...btn(C.soft,C.muted),padding:"3px 9px",fontSize:10}}>+ tarea</button>
              </div>

                  <button onClick={()=>toggleTask(t.id)} style={{width:13,height:13,borderRadius:3,border:`1.5px solid ${am.color}`,background:t.done?am.color:"none",cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,color:"#fff"}}>{t.done?"✓":""}</button>
                  <span style={{flex:1,fontSize:12,color:t.done?C.muted:C.text,textDecoration:t.done?"line-through":"none"}}>{t.text}</span>
                  <span style={tag(am.color)}>{am.label.split(" ")[0]}</span>

              {uns.map(t=>{

                </div>;

            </div>;
          })}

          {calView==="month"&&<div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}}>
              {DAYS_S.map(d=><div key={d} style={{textAlign:"center",fontSize:10,color:C.muted,fontWeight:600,padding:"3px 0"}}>{d}</div>)}

                  <div style={{fontSize:12,fontWeight:isT?700:400,color:isT?"#fff":C.text,marginBottom:3}}>{d.getDate()}</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:2}}>{dt.slice(0,4).map(t=><div key={t.id} style={{width:5,height:5,borderRadius:99,background:t.done?"#ccc":AREA_META[t.area].color}}/>)}</div>
                  {dt.length>0&&<div style={{fontSize:8,color:isT?"rgba(255,255,255,.5)":C.muted,marginTop:2}}>{dt.filter(t=>t.done).length}/{dt.length}</div>}

          const at=tasks.filter(t=>t.area===ak);
          return <div key={ak} style={{...card(),marginBottom:10,background:am.color+"08",borderTop:`3px solid ${am.color}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:19,fontWeight:600,color:am.color}}>{am.label}</span>
              <span style={{fontSize:11,color:C.muted}}>{at.filter(t=>t.done).length}/{at.length}</span>
            </div>
            <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:ak==="uni"?8:0}}>
              {(TIPOS[ak]||[]).map(t=><div key={t.id} style={{background:C.surface,borderRadius:8,padding:"5px 11px",border:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:5}}>
                <span style={{fontSize:13}}>{t.icon}</span>
                <span style={{fontSize:11,fontWeight:600,color:t.color}}>{t.label}</span>
              </div>)}
            </div>
            {ak==="uni"&&<div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{RAMOS.map(r=><span key={r} style={{...tag(C.uni),fontSize:10}}>{r}</span>)}</div>}

          <div style={{display:"flex",gap:6,marginBottom:14}}>
            {[["gastos","🧾 Gastos"],["suscripciones","🔄 Suscripciones"]].map(([k,l])=>(
              <button key={k} onClick={()=>setGastoTab(k)} style={{...btn(gastoTab===k?C.text:C.soft,gastoTab===k?"#fff":C.muted),fontSize:12,padding:"6px 14px"}}>{l}</button>
            ))}
          </div>

          {gastoTab==="gastos"&&<>
            {expenses.length>0&&<div style={{...card(),marginBottom:12,background:"#fdfcfb"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:10}}>
                <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:18,fontWeight:600}}>Resumen</span>
                <span style={{fontSize:17,fontWeight:700}}>${fmtMoney(totalExp)}</span>
              </div>
              {expSummary.map(([cat,amt])=>{
                const pct=totalExp>0?(amt/totalExp)*100:0, col=catC(cat);
                return <div key={cat} style={{marginBottom:7}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                    <span style={{fontSize:12}}>{cat}</span>
                    <span style={{fontSize:12,fontWeight:600,color:col}}>${fmtMoney(amt)} <span style={{fontSize:10,color:C.muted}}>({pct.toFixed(0)}%)</span></span>
                  </div>
                  <div style={{height:4,background:C.soft,borderRadius:99,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,background:col,borderRadius:99}}/></div>
                </div>;
              })}
            </div>}

            <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>handleImg(e.target.files[0])}/>
            <div style={{display:"flex",gap:8,marginBottom:12}}>
              <button onClick={()=>fileRef.current.click()} style={{...btn(C.alim),flex:1,fontSize:13}}>📷 Subir foto de gasto</button>
              <button onClick={()=>{setShowExpForm(p=>!p);setScanState("idle");setExpForm({desc:"",amount:"",date:todayStr,category:"Alimentación",notes:"",imagePreview:null,confidence:null});}} style={{...btn(C.soft,C.muted),fontSize:12}}>✏️ Manual</button>
            </div>

            {scanState==="scanning"&&<div style={{...card(),marginBottom:12,textAlign:"center",padding:24}}><div style={{fontSize:30,marginBottom:6}}>🔍</div><p style={{fontSize:13,color:C.muted}}>Claude está leyendo tu comprobante…</p></div>}

            {showExpForm&&scanState!=="scanning"&&<div style={{...card(),marginBottom:12,background:"#fdfcfb"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <p style={{margin:0,fontSize:13,fontWeight:600}}>{scanState==="done"?"✅ Revisá los datos":scanState==="error"?"⚠️ Completá manual":"Nuevo gasto"}</p>
                {expForm.confidence&&<span style={{fontSize:10,background:confC(expForm.confidence)+"22",color:confC(expForm.confidence),borderRadius:99,padding:"2px 9px",fontWeight:600}}>Confianza: {expForm.confidence}</span>}

              {expForm.notes&&scanState==="done"&&<div style={{background:"#fff8f0",border:`1px solid ${C.alim}44`,borderRadius:8,padding:"7px 11px",marginBottom:8,fontSize:12,color:C.alim}}>💡 {expForm.notes}</div>}
              <input value={expForm.desc} onChange={e=>setExpForm(p=>({...p,desc:e.target.value}))} placeholder="Descripción del gasto…" style={{...inp(),marginBottom:7}}/>
              <div style={{display:"flex",gap:7,marginBottom:7}}>
                <input type="number" value={expForm.amount} onChange={e=>setExpForm(p=>({...p,amount:e.target.value}))} placeholder="Monto $" style={{...inp(),flex:1}}/>
                <input type="date" value={expForm.date} onChange={e=>setExpForm(p=>({...p,date:e.target.value}))} style={{...inp(),flex:1}}/>
              </div>
              <select value={expForm.category} onChange={e=>setExpForm(p=>({...p,category:e.target.value}))} style={{...inp(),marginBottom:10}}>
                {EXPENSE_CATS.map(c=><option key={c}>{c}</option>)}

              <div style={{display:"flex",gap:7}}>
                <button onClick={addExpense} style={btn(C.text)}>Guardar</button>
                <button onClick={()=>{setShowExpForm(false);setScanState("idle");}} style={btn(C.soft,C.muted)}>Cancelar</button>
              </div>
            </div>}

            {!expenses.length&&!showExpForm&&scanState==="idle"&&<div style={{textAlign:"center",padding:"28px 20px",color:C.muted}}><div style={{fontSize:32,marginBottom:8}}>🧾</div><p style={{fontSize:13}}>Subí una foto de tu boleta o ticket<br/>y Claude lo registra automáticamente.</p></div>}

            {expenses.length>0&&<div style={card()}>
              <p style={{margin:"0 0 10px",fontSize:13,fontWeight:600}}>Historial</p>
              {[...expenses].reverse().map(e=>{
                const col=catC(e.category);
                return <div key={e.id} style={{display:"flex",alignItems:"center",gap:9,padding:"7px 0",borderBottom:`1px solid ${C.border}`}}>
                  {e.imagePreview?<img src={e.imagePreview} style={{width:34,height:34,borderRadius:6,objectFit:"cover",flexShrink:0}}/>:<div style={{width:34,height:34,borderRadius:6,background:col+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>🧾</div>}
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:500}}>{e.desc}</div>
                    <div style={{fontSize:10,color:C.muted}}>{e.category} · {e.date}</div>
                  </div>
                  <span style={{fontSize:14,fontWeight:700}}>${fmtMoney(e.amount)}</span>
                  <button onClick={()=>deleteExpense(e.id)} style={{background:"none",border:"none",color:"#ccc",cursor:"pointer",fontSize:16}}>×</button>
                </div>;
              })}
            </div>}
          </>}

          {gastoTab==="suscripciones"&&<>
            <div style={{...card(),marginBottom:12,background:"#fdfcfb"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:3}}>
                <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:18,fontWeight:600}}>Suscripciones activas</span>
                <span style={{fontSize:17,fontWeight:700,color:C.personal}}>${fmtMoney(Math.round(monthSubs))}<span style={{fontSize:10,fontWeight:400,color:C.muted}}>/mes</span></span>
              </div>
              <p style={{margin:0,fontSize:11,color:C.muted}}>{subs.filter(s=>s.active).length} activas · {subs.filter(s=>!s.active).length} pausadas</p>
            </div>

            <button onClick={()=>setShowSubForm(p=>!p)} style={{...btn(C.text),marginBottom:12,width:"100%",fontSize:13}}>{showSubForm?"Cerrar":"+ Nueva suscripción"}</button>

            {showSubForm&&<div style={{...card(),marginBottom:12,background:"#fdfcfb"}}>
              <p style={{margin:"0 0 10px",fontSize:13,fontWeight:600}}>Nueva suscripción</p>
              <input value={subForm.name} onChange={e=>setSubForm(p=>({...p,name:e.target.value}))} placeholder="Nombre (ej: Spotify)" style={{...inp(),marginBottom:7}}/>
              <div style={{display:"flex",gap:7,marginBottom:7}}>
                <input type="number" value={subForm.amount} onChange={e=>setSubForm(p=>({...p,amount:e.target.value}))} placeholder="Monto $" style={{...inp(),flex:1}}/>
                <select value={subForm.cycle} onChange={e=>setSubForm(p=>({...p,cycle:e.target.value}))} style={{...inp(),flex:1}}>
                  {["Mensual","Anual","Semanal"].map(c=><option key={c}>{c}</option>)}
                </select>
              </div>
              <div style={{display:"flex",gap:7,marginBottom:10}}>
                <select value={subForm.category} onChange={e=>setSubForm(p=>({...p,category:e.target.value}))} style={{...inp(),flex:1}}>
                  {SUB_CATS.map(c=><option key={c}>{c}</option>)}
                </select>
                <input type="number" value={subForm.day} onChange={e=>setSubForm(p=>({...p,day:e.target.value}))} placeholder="Día cobro" style={{...inp(),flex:1}}/>
              </div>
              <div style={{display:"flex",gap:7}}>
                <button onClick={addSub} style={btn(C.text)}>Agregar</button>
                <button onClick={()=>setShowSubForm(false)} style={btn(C.soft,C.muted)}>Cancelar</button>
              </div>
            </div>}

            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {subs.map(s=>{
                const ma=s.cycle==="Mensual"?s.amount:s.cycle==="Anual"?s.amount/12:s.amount*4.33;
                return <div key={s.id} style={{...card(),opacity:s.active?1:.55,display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:38,height:38,borderRadius:9,background:C.personal+"22",border:`1px solid ${C.personal}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,flexShrink:0}}>🔄</div>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",alignItems:"center",gap:7}}>
                      <span style={{fontSize:13,fontWeight:600}}>{s.name}</span>
                      <span style={tag(C.personal)}>{s.cycle}</span>
                      {s.day&&<span style={{fontSize:10,color:C.muted}}>día {s.day}</span>}
                    </div>
                    <div style={{fontSize:11,color:C.muted}}>{s.category} · ~${fmtMoney(Math.round(ma))}/mes</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:14,fontWeight:700}}>${fmtMoney(s.amount)}</div>
                    <div style={{fontSize:10,color:C.muted}}>{s.cycle.toLowerCase()}</div>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:4}}>
                    <button onClick={()=>toggleSub(s.id)} style={{...btn(s.active?C.soft:C.base+"33",s.active?C.muted:C.base),fontSize:11,padding:"3px 8px"}}>{s.active?"Pausar":"Activar"}</button>
                    <button onClick={()=>deleteSub(s.id)} style={{background:"none",border:"none",color:"#ccc",cursor:"pointer",fontSize:11,padding:"2px 0"}}>Eliminar</button>
                  </div>
                </div>;
              })}
            </div>
          </>}
        </>}

      </div>
    </div>
  );
}


function LoginScreen() {
  const [err, setErr] = useState("");
  const signIn = async () => {
    setErr("");
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });
      await auth.signInWithPopup(provider);
    } catch (e) {
      console.error(e);
      setErr("No se pudo iniciar sesión. Si estás en Safari y se bloquea la ventana, prueba permitiendo pop-ups o abre el planner en Chrome.");
    }
  };
  return (
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:20,color:C.text}}>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:18,padding:28,maxWidth:420,width:"100%",boxShadow:"0 10px 30px rgba(0,0,0,.04)",textAlign:"center"}}>
        <div style={{fontSize:32,marginBottom:8}}>✨</div>
        <h1 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:34,margin:"0 0 6px"}}>Mi Planner</h1>
        <p style={{fontSize:14,color:C.muted,lineHeight:1.6,margin:"0 0 20px"}}>Inicia sesión con Google para guardar tus tareas, hábitos, notas y finanzas en la nube y verlas en todos tus dispositivos.</p>
        <button onClick={signIn} style={{background:C.text,color:"#fff",border:"none",borderRadius:10,padding:"12px 18px",fontSize:14,fontWeight:600,cursor:"pointer",width:"100%"}}>Entrar con Google</button>
        {err && <p style={{fontSize:12,color:C.salud,marginTop:14,lineHeight:1.5}}>{err}</p>}
        <p style={{fontSize:11,color:C.muted,margin:"16px 0 0"}}>Plan gratis Spark · Datos privados por usuario</p>
      </div>
    </div>
  );
}

function Root() {
  const [user, setUser] = useState(null);
  const [ready, setReady] = useState(false);
  useEffect(() => auth.onAuthStateChanged(u => { setUser(u); setReady(true); }), []);
  if (!ready) return <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"DM Sans",color:C.muted}}>Cargando planner…</div>;
  if (!user) return <LoginScreen/>;
  return <AuthContext.Provider value={user}><App/></AuthContext.Provider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Root));
</script>
</body>
</html>
